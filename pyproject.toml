[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-skills-demo"
version = "0.1.0"
description = "LangChain agent with on-demand filesystem skills and a FastAPI API"
requires-python = ">=3.11,<3.14"
dependencies = [
  "langchain==1.4.7",
  "langchain-openai==1.7.3",
  "langgraph==1.2.19",
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic-settings==2.16.2",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

